spring.application.name=hiregrad-backend
server.port=8081

# ===== MySQL ===== (auto-creates the "hiregrad" database if missing)
spring.datasource.url=jdbc:mysql://localhost:3306/hiregrad?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== JWT ===== (secret MUST be at least 32 characters for HS256)
app.jwt.secret=48794cab2af651d55b12d8a5f1f082d1
app.jwt.expiration-ms=86400000

# ===== Seeded accounts =====
# Admin = developer-provided credentials (you hand these to the placement cell)
app.seed.admin.username=admin
app.seed.admin.password=admin123
app.seed.admin.full-name=Placement Cell
# Demo student for testing (later, admins create students via the admin module)
app.seed.student.username=student
app.seed.student.password=student123
app.seed.student.full-name=Aarav Sharma